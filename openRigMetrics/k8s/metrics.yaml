## openRigMetrics stack — receiver + Prometheus + Grafana
## All resources in the existing openrig namespace.
---
# ── Receiver (accepts heartbeats, exposes /metrics) ──────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-receiver
  namespace: openrig
  labels:
    app: metrics-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-receiver
  template:
    metadata:
      labels:
        app: metrics-receiver
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: receiver
          image: harbor.lab.outcastlabs.com/openrig/openrig-metrics:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-receiver
  namespace: openrig
  labels:
    app: metrics-receiver
spec:
  selector:
    app: metrics-receiver
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
---
# ── Prometheus ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: openrig
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: openrig-metrics
        static_configs:
          - targets: ["metrics-receiver:8090"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: openrig
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=365d"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: openrig
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
---
# ── Grafana ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: openrig
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: openrig
  labels:
    app: grafana
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: grafana
          image: grafana/grafana:12.0.1
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "openrig"
            - name: GF_SERVER_ROOT_URL
              value: "https://metrics.openrig.app"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: openrig
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
# ── Ingress ──────────────────────────────────────────────────────────────
# metrics.openrig.app routes:
#   /v1/heartbeat → receiver (reflectors POST here)
#   /metrics      → receiver (Prometheus scrapes internally, but exposed for debugging)
#   /             → Grafana  (dashboards)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics
  namespace: openrig
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - metrics.openrig.app
      secretName: metrics-tls
  rules:
    - host: metrics.openrig.app
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                name: metrics-receiver
                port:
                  number: 8090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
